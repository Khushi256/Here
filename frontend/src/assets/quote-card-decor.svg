<svg width="280" height="180" viewBox="0 0 280 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="280" height="180" rx="16" fill="#F4EFE6"/>

  <!-- Top Handwritten Text Quote -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Georgia, serif" text-anchor="middle">
    <text x="140" y="44" font-size="16" font-style="italic" font-weight="600" fill="#43564D" letter-spacing="0.2">
      It's okay
    </text>
    <text x="140" y="66" font-size="16" font-style="italic" font-weight="600" fill="#43564D" letter-spacing="0.2">
      to feel what
    </text>
    <text x="140" y="88" font-size="16" font-style="italic" font-weight="600" fill="#43564D" letter-spacing="0.2">
      you feel.
    </text>
    
    <!-- Heart Icon below quote -->
    <path d="M 140 102 C 140 99.5 137.5 98 135.5 99.5 C 133.5 98 131 99.5 131 102 C 131 105 135.5 108 135.5 108 C 135.5 108 140 105 140 102 Z" fill="#99B0A3"/>
  </g>

  <!-- Bottom Watercolor Hills & Sun Graphic -->
  <g>
    <!-- Soft Coral Sun Circle -->
    <circle cx="240" cy="115" r="16" fill="#F5C4B3" opacity="0.9"/>

    <!-- Far Back Purple Hill -->
    <path d="M 0 160 Q 70 135 140 148 T 280 130 V 180 H 0 Z" fill="#AEA0BD" opacity="0.7"/>

    <!-- Mid Sage Green Hill -->
    <path d="M 0 170 Q 90 145 180 158 T 280 145 V 180 H 0 Z" fill="#8CA698" opacity="0.85"/>

    <!-- Foreground Soft Green Wave -->
    <path d="M 0 155 Q 100 175 190 162 T 280 168 V 180 H 0 Z" fill="#6B887B"/>
  </g>
</svg>
